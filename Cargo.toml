[package]
name = "shimen"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ego-tree = "0.11"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "gzip", "brotli", "charset"] }
scraper = "0.29.0"
terminal_size = "0.4.4"
unicode-width = "0.2.3"
url = "2.5.8"
